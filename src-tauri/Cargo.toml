[package]
name = "glint"
version = "0.2.3"
description = "A fast desktop video player with a YouTube-style interface"
authors = ["Adham Yasser"]
license = "MIT"
edition = "2024"

[lib]
name = "glint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["self-update"]
# Glint's own updater: checks GitHub releases and installs signed updates.
# The Microsoft Store build turns it off (`--no-default-features` with
# GLINT_STORE=1), because the Store installs updates itself.
self-update = ["dep:tauri-plugin-updater", "dep:reqwest", "dep:rustls"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
bytes = "1"
http-body = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "fs", "io-util", "sync", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.21"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
# Already in the build through the updater; used to tell "no manifest
# published yet" (404) apart from other failed checks.
reqwest = { version = "0.13", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

# Job object so the bundled ffmpeg never outlives Glint. Already in the build
# through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
