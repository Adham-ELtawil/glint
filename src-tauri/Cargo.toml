[package]
name = "glint"
version = "0.1.6"
description = "A fast desktop video player with a YouTube-style interface"
authors = ["Adham Yasser"]
license = "MIT"
edition = "2024"

[lib]
name = "glint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
bytes = "1"
http-body = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "fs", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.21"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
